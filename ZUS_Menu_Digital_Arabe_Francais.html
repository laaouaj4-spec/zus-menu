<style>
:root{--purple:#74559b;--light:#f4effa;--ink:#2e2638;--gold:#d9c6a0}
*{box-sizing:border-box}body{margin:0;background:#f7f4fa;color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,#5d427e,#9b83b8);color:white;text-align:center;padding:28px 16px 24px}
.logo{width:72px;height:72px;border:2px solid #fff;border-radius:50%;margin:auto auto 8px;display:grid;place-items:center;font-size:25px;font-weight:bold}
h1{font-size:30px;margin:5px 0}header p{margin:6px 0;color:#f3edf8}
.controls{position:sticky;top:0;background:#fff;padding:12px;box-shadow:0 2px 12px #0001;z-index:2}
input{width:100%;padding:12px;border:1px solid #ddd0eb;border-radius:12px;font-size:16px;margin-bottom:9px}
nav{display:flex;gap:7px;overflow:auto;padding-bottom:2px}nav button{white-space:nowrap;border:1px solid #ddd0eb;background:#f7f3fb;color:#5d427e;border-radius:20px;padding:8px 12px}
nav button.active{background:var(--purple);color:white}
main{max-width:760px;margin:auto;padding:12px}.section{background:#fff;border-radius:16px;margin:14px 0;padding:16px;box-shadow:0 3px 14px #39234e0c}
h2{color:var(--purple);font-size:21px;margin:0 0 12px;border-bottom:1px solid #eee5f5;padding-bottom:10px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e8e0ee}.item:last-child{border-bottom:0}
.names{flex:1}.fr{font-size:12px;color:#82748f;margin-top:4px;direction:ltr;text-align:right}
.price{font-weight:bold;color:#5d427e;white-space:nowrap}.price small{font-weight:normal;font-size:11px}
footer{text-align:center;padding:24px;color:#756783;font-size:13px}
</style></head><body>

let active='all';
