<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUS Café | Menu</title><meta name="theme-color" content="#74559b">
<style>
:root{--purple:#74559b;--light:#f4effa;--ink:#2e2638}*{box-sizing:border-box}body{margin:0;background:#f7f4fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,#5d427e,#9b83b8);color:#fff;text-align:center;padding:28px 16px 24px}.logo{width:72px;height:72px;border:2px solid #fff;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:25px;font-weight:bold}h1{font-size:30px;margin:5px 0}header p{margin:6px 0;color:#f3edf8}.controls{position:sticky;top:0;background:#fff;padding:12px;box-shadow:0 2px 12px #0001;z-index:2}input{width:100%;padding:12px;border:1px solid #ddd0eb;border-radius:12px;font-size:16px;margin-bottom:9px}nav{display:flex;gap:7px;overflow:auto;padding-bottom:2px}nav button{white-space:nowrap;border:1px solid #ddd0eb;background:#f7f3fb;color:#5d427e;border-radius:20px;padding:8px 12px;font-size:14px}nav button.active{background:var(--purple);color:#fff}main{max-width:760px;margin:auto;padding:12px}.section{background:#fff;border-radius:16px;margin:14px 0;padding:16px;box-shadow:0 3px 14px #39234e0c}h2{color:var(--purple);font-size:21px;margin:0 0 12px;border-bottom:1px solid #eee5f5;padding-bottom:10px}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #e8e0ee}.item:last-child{border-bottom:0}.names{flex:1}.price{font-weight:bold;color:#5d427e;white-space:nowrap}footer{text-align:center;padding:24px;color:#756783;font-size:13px}
</style></head><body>
<header><div class="logo">ZUS</div><h1>Menu ZUS</h1><p>Café • Boissons • Desserts • Petit-déjeuner</p><p>Bienvenue chez ZUS !</p></header>
<div class="controls"><input id="search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit"><nav id="nav"></nav></div>
<main id="menu"></main><footer>Tous les prix sont indiqués en dirhams marocains (DH).</footer>
<script>
const sections = [{"name": "Gaufres de Liège", "items": [{"name": "Gaufre nature (sucre)", "price": 10}, {"name": "Gaufre nature (confiture, miel)", "price": 12}, {"name": "Gaufre Nutella", "price": 15}, {"name": "Gaufre kunafa pistache", "price": 17}, {"name": "Gaufre Lotus Speculoos", "price": 19}, {"name": "Gaufre blanche neige", "price": 25}]}, {"name": "Crêpes", "items": [{"name": "Crêpe nature (sucre)", "price": 12}, {"name": "Crêpe nature (miel)", "price": 14}, {"name": "Crêpe Nutella", "price": 17}, {"name": "Crêpe Nutella banane", "price": 20}, {"name": "Crêpe Oreo", "price": 23}, {"name": "Crêpe spaghetti ZUS", "price": 23}, {"name": "Crêpe tagliatelles ZUS", "price": 24}, {"name": "Crêpe kunafa pistache", "price": 25}, {"name": "Crêpe Lotus Speculoos", "price": 29}, {"name": "Crêpe blanche neige", "price": 35}]}, {"name": "ZUS Deal Breakfast", "items": [{"name": "Pauz Zen Cake", "price": 9}, {"name": "Pauz Zen Beldi", "price": 12}, {"name": "Pauz Zen Bahla", "price": 12}, {"name": "Pauz Zen Briwate", "price": 16}, {"name": "Pauz Zen French Toast", "price": 35}, {"name": "Deal Pauz Zen (Beldi + thé)", "price": 15}, {"name": "Deal Pauz Zen (Bahla + thé)", "price": 15}, {"name": "Deal Pauz Zen (Briwate + thé)", "price": 19}, {"name": "Supplément miel, beurre, confiture", "price": 2}]}, {"name": "Boissons chaudes", "items": [{"name": "Espresso", "price": 8}, {"name": "Americano", "price": 10}, {"name": "Marocchino Nass Nass", "price": 10}, {"name": "Cappuccino", "price": 12}, {"name": "Chocolat chaud", "price": 13}, {"name": "Cappuccino Nutella", "price": 15}, {"name": "ZUS Spanish Latte", "price": 18}]}, {"name": "Milkshake", "items": [{"name": "ZUS Cookies", "price": 22}, {"name": "ZUS Oreo Crush", "price": 24}, {"name": "ZUS Frappe Chocolat", "price": 26}, {"name": "ZUS Frappe Fraise", "price": 26}, {"name": "ZUS Frappe Caramel", "price": 26}, {"name": "ZUS Snickers Bomb", "price": 30}, {"name": "Original Piña Colada", "price": 32}, {"name": "Grand Frappuccino Strawberry", "price": 33}, {"name": "Grand Frappuccino Blueberry", "price": 33}]}, {"name": "Glacées & Iced", "items": [{"name": "ZUS Iced Coffee", "price": 12}, {"name": "Mojito classique", "price": 12}, {"name": "Mojito fraise", "price": 18}, {"name": "Mojito mangue", "price": 18}, {"name": "Iced Macchiato Caramel", "price": 19}, {"name": "Iced Spanish Latte", "price": 20}, {"name": "Iced Coffee Orange Juice", "price": 29}]}, {"name": "Jus", "items": [{"name": "Jus d’orange", "price": 13}, {"name": "Banane", "price": 16}, {"name": "Fraise", "price": 16}, {"name": "Mangue", "price": 19}, {"name": "Ananas", "price": 20}, {"name": "Mocktail Sunshine Twist", "price": 30}]}, {"name": "Green Tea & Coffee", "items": [{"name": "Thé Mna3na3", "price": 5}, {"name": "Matcha Latte", "price": 40}, {"name": "Matcha Iced Latte", "price": 44}, {"name": "Matcha Smoothie Banana", "price": 49}, {"name": "Detox 1", "price": 42}, {"name": "Detox 2", "price": 45}]}];
const nav=document.getElementById('nav'), menu=document.getElementById('menu'), search=document.getElementById('search');let active='all';
function render(){nav.innerHTML='<button class="'+(active==='all'?'active':'')+'" data-id="all">Tout</button>'+sections.map((s,i)=>'<button class="'+(active===String(i)?'active':'')+'" data-id="'+i+'">'+s.name+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()});const q=search.value.trim().toLocaleLowerCase('fr');menu.innerHTML=sections.map((s,i)=>{if(active!=='all'&&active!==String(i))return '';const items=s.items.filter(it=>it.name.toLocaleLowerCase('fr').includes(q));if(!items.length)return '';return '<section class="section"><h2>'+s.name+'</h2>'+items.map(it=>'<div class="item"><div class="names">'+it.name+'</div><div class="price">'+it.price+' DH</div></div>').join('')+'</section>';}).join('');}
search.addEventListener('input',render);render();
</script></body></html>
